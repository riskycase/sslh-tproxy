services:
  sslh-tproxy:
    build: .
    network_mode: host          # rules must land in the host netns, where the backends reply from
    # Needed to write route_localnet: /proc/sys is read-only otherwise, and compose's
    # sysctls: key is rejected under host networking. Accepted trade-off to keep every
    # piece of host setup inside this stack; this container can act as root on the host.
    privileged: true
    restart: unless-stopped
    environment:
      SSLH_IFACE: "${SSLH_IFACE:-}"   # empty: detected from the default route
      SSLH_PORTS: "${SSLH_PORTS:-22 8443}"
    healthcheck:
      test: ["CMD", "sslh-tproxy", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sslh:
    image: ghcr.io/yrutschle/sslh:latest
    environment:
      - TZ=${TZ}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    command: --transparent --foreground --listen 0.0.0.0:443 --ssh 127.0.0.1:22 --tls 127.0.0.1:8443
    network_mode: host
    restart: unless-stopped
    container_name: sslh
    depends_on:
      sslh-tproxy:
        condition: service_healthy
      nginx-ui:
        condition: service_started

  nginx-ui:
    stdin_open: true
    tty: true
    container_name: nginx-ui
    restart: always
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - '/mnt/user/appdata/nginx:/etc/nginx'
      - '/mnt/user/appdata/nginx-ui:/etc/nginx-ui'
      - '/var/www:/var/www'
      - '/var/run/docker.sock:/var/run/docker.sock'
    network_mode: host
    image: 'uozi/nginx-ui:latest'
    healthcheck:
      test: curl --fail http://localhost:9000 | grep Nginx
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
